name: Installation problem
description: Report a host installation, upgrade, or wiring failure.
title: "[Install]: "
labels:
  - installation
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic or redacted details. Do not attach raw databases, settings files, prompts, source code, credentials, endpoint URLs, provider payloads, or unreviewed logs.
  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - Codex
        - Claude Code
        - OpenClaw
        - Google Antigravity
        - Other
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Installation channel
      options:
        - npm
        - ClawHub
        - Claude marketplace/plugin
        - Source checkout
        - Local package/tarball
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ExperienceEngine version
      placeholder: 0.5.1
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Sanitized reproduction steps
      description: Include commands and observable states, but replace usernames, paths, repository names, tokens, endpoints, and deployment names.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Prefer stable error codes over free-text logs.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Reviewed diagnostic evidence
      description: Optionally attach the manifest/archive produced by `ee diagnose --prepare-bundle` and `ee diagnose --archive <review-directory>` after reviewing it locally.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I reviewed any diagnostic manifest/archive before attaching it.
          required: true
        - label: I did not attach raw SQLite files, settings, prompts, source code, credentials, endpoint URLs, provider payloads, or unreviewed logs.
          required: true
