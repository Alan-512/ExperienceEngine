<svg width="1200" height="920" viewBox="0 0 1200 920" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="920" rx="20" fill="#0B1020"/>
  <rect x="24" y="24" width="1152" height="64" rx="14" fill="#131A2E"/>
  <circle cx="60" cy="56" r="9" fill="#FF5F57"/>
  <circle cx="88" cy="56" r="9" fill="#FEBB2E"/>
  <circle cx="116" cy="56" r="9" fill="#28C840"/>
  <text x="600" y="62" text-anchor="middle" fill="#DDE7FF" font-family="DejaVu Sans Mono, monospace" font-size="24">ee inspect --last --verbose</text>

  <rect x="24" y="104" width="1152" height="792" rx="14" fill="#0F172A"/>

  <g font-family="DejaVu Sans Mono, monospace" font-size="24">
    <text x="48" y="152" fill="#93C5FD">$ ee inspect --last --verbose</text>

    <text x="48" y="198" fill="#E5E7EB">Task: fix SQLite startup failure in this repo</text>
    <text x="48" y="232" fill="#E5E7EB">Intervention: inject</text>
    <text x="48" y="266" fill="#E5E7EB">Automatic feedback: reinforced</text>

    <text x="48" y="324" fill="#FCA5A5">Previous repeated mistake:</text>
    <text x="72" y="358" fill="#E5E7EB">- opening the DB before running the migration</text>
    <text x="72" y="392" fill="#E5E7EB">- wasting turns on the same wrong path</text>

    <text x="48" y="450" fill="#A7F3D0">Injected guidance:</text>
    <text x="72" y="484" fill="#E5E7EB">- Run the migration before opening the DB connection.</text>
    <text x="72" y="518" fill="#E5E7EB">- Keep the prompt small: one repo-specific constraint only.</text>

    <text x="48" y="576" fill="#FDE68A">Outcome:</text>
    <text x="72" y="610" fill="#E5E7EB">- the host agent avoided the known bad path</text>
    <text x="72" y="644" fill="#E5E7EB">- the task moved directly toward the working fix</text>

    <text x="48" y="702" fill="#C4B5FD">Governance:</text>
    <text x="72" y="736" fill="#E5E7EB">- helpful guidance stays eligible for future use</text>
    <text x="72" y="770" fill="#E5E7EB">- harmful guidance can cool, quarantine, or retire later</text>

    <text x="48" y="828" fill="#67E8F9">Why this is not just memory:</text>
    <text x="72" y="862" fill="#E5E7EB">- ExperienceEngine governs whether learned guidance should still ship.</text>
  </g>
</svg>
